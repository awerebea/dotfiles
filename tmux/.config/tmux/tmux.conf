# ~/.config/tmux/tmux.conf
#
# Entry point. Standalone tmux config (tmux 3.4+, no Oh My Tmux dependency).
# Split into topic files so each concern can be read/edited on its own:
#
#   options.conf    - general/display/history/terminal/clipboard `set` options
#   bindings.conf   - all key bindings
#   appearance.conf - tmux-powerkit (Catppuccin Mocha) status bar + pane borders
#   plugins.conf    - TPM plugin declarations/settings + TPM bootstrap
#
# appearance.conf is sourced before plugins.conf on purpose: tmux-powerkit
# reads its `@powerkit_*` options at the moment TPM runs its init script, so
# those options must already be set by the time plugins.conf's final
# `run '.../tpm/tpm'` line executes.

source-file "$HOME/.config/tmux/options.conf"
source-file "$HOME/.config/tmux/bindings.conf"
source-file "$HOME/.config/tmux/appearance.conf"
source-file "$HOME/.config/tmux/plugins.conf"

# reload / edit configuration
bind r source-file "$HOME/.config/tmux/tmux.conf" \; display-message "tmux.conf reloaded"
bind e new-window -n "tmux.conf" "\${EDITOR:-vim} $HOME/.config/tmux/tmux.conf"
