# ~/.config/tmux/options.conf
#
# General behavior: prefix, mouse, history, terminal/color, clipboard.
# All `bind`/`unbind` live in bindings.conf instead; this file is `set` only.

# -- prefix ------------------------------------------------------------------
# Oh My Tmux used to run both C-b and a GNU-Screen-style C-a prefix at once;
# this repo only ever wanted the single C-a prefix, so that's all this keeps.
set -g prefix C-a
unbind C-b

# -- general -------------------------------------------------------------
set -s escape-time 10        # fast enough that <Esc> in nvim isn't laggy,
                              # long enough to still debounce ambiguous
                              # escape sequences (arrow keys, alt-combos)
set -g repeat-time 500
set -s focus-events on

set -g mouse on

set -g status-keys vi
set -g mode-keys vi

set -g history-limit 1000000
set -g history-file "$HOME/.tmux_history"  # tmux >= 3.3: persist command
                                            # history across restarts

# -- display -------------------------------------------------------------
set -g base-index 1          # start windows numbering at 1
setw -g pane-base-index 1    # make pane numbering consistent with windows

setw -g automatic-rename on  # rename window to reflect current program
set -g renumber-windows on   # renumber windows when a window is closed

set -g set-titles on
set -g set-titles-string "#h ❐ #S ● #I #W"  # unchanged from Oh My Tmux's default

set -g display-panes-time 800  # slightly longer pane indicators display time
set -g display-time 1000       # slightly longer status messages display time

set -g status-interval 10      # redraw status line every 10 seconds

set -g monitor-activity on
set -g visual-activity off

setw -g aggressive-resize on   # useful with grouped sessions / multi-monitor

set -g status-position top

# Ctrl-Shift-<key> bindings (see bindings.conf window swap) need the
# terminal to report shift state on Ctrl combos; safe to force on with any
# modern terminal (iTerm2, kitty, WezTerm all support it).
set -g extended-keys on

# -- terminal / true color -------------------------------------------------
# NOTE: these terminal-overrides values MUST be single-quoted. Double-quoted
# tmux.conf strings go through backslash-escape processing that eats the
# `\E` (this bit us once already: it silently became the literal text
# "E[3m", printed for real instead of acting as an escape sequence).
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm*:sitm=\E[3m'  # italics on macOS terminals
set -as terminal-overrides ',*256col*:Tc'        # force true color flag for
                                                  # terminals tmux doesn't
                                                  # already know support it
set -as terminal-features ",xterm-kitty:RGB"     # true color for kitty
set -as terminal-features ",xterm-kitty:sync"    # synchronized-output:
                                                  # stops cursor-sweep
                                                  # flicker in Neovim

# -- clipboard -------------------------------------------------------------
# tmux-yank (see plugins.conf) copies copy-mode selections to the OS
# clipboard for local sessions. set-clipboard additionally makes tmux emit
# OSC 52, so copies also reach the host terminal's clipboard over SSH or
# from inside a nested tmux -- Oh My Tmux never did this.
set -s set-clipboard on
