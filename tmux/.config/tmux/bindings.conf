# ~/.config/tmux/bindings.conf
#
# All key bindings. reload/edit (prefix r / prefix e) live in tmux.conf
# itself since they're about the file layout, not day-to-day workflow.
#
# A few bindings that used to exist in Oh My Tmux / this repo's old
# .tmux.conf.local are intentionally NOT reproduced here because a plugin
# (loaded later, via TPM) already owned the same key and won every time tmux
# started -- so the "old" binding was already dead in daily use. See
# MIGRATION.md for the full list (F -> fpp, p -> paste-buffer, b ->
# list-buffers, lowercase m -> mouse toggle).

# -- prefix --------------------------------------------------------------
bind C-a send-prefix   # press prefix twice to send a literal C-a through

# -- session / window creation ---------------------------------------------
bind C-c new-session
bind C-f command-prompt -p find-session 'switch-client -t %%'
bind BTab switch-client -l  # move to last session

# new window keeps the current pane's working directory
bind c new-window -c "#{pane_current_path}"

# -- splits ----------------------------------------------------------------
# all splits keep the current pane's working directory
bind "\\" split-window -h  -c "#{pane_current_path}"
bind M-\\  split-window -hb -c "#{pane_current_path}"  # new pane to the left
bind -     split-window -v  -c "#{pane_current_path}"
bind M--   split-window -vb -c "#{pane_current_path}"  # new pane above
bind |     split-window -fh -c "#{pane_current_path}"  # full height, left/right
bind M-\|  split-window -fhb -c "#{pane_current_path}"
bind _     split-window -fv -c "#{pane_current_path}"  # full width, top/bottom
bind M-_   split-window -fvb -c "#{pane_current_path}"

# -- pane navigation / management -------------------------------------------
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind > swap-pane -D  # swap current pane with the next one
bind < swap-pane -U  # swap current pane with the previous one

# maximize/restore the current pane: tmux's native pane zoom replaces the
# old Oh My Tmux "spawn a hidden window and swap into it" hack outright
bind + resize-pane -Z

bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# jump straight to a pane by index
bind C-j command-prompt -p "Jump to pane index:" "select-pane -t '%%'"

# reorganize current pane with the previous-numbered pane
bind M-, move-pane -t '.-'     # previous on top, current below
bind M-. move-pane -h -t '.-'  # previous on the left, current on the right

# swap the active pane with its geometrically-adjacent neighbor and follow
# focus; -r keeps this repeatable within repeat-time, so holding prefix and
# tapping the arrow a few times keeps walking the pane across the layout.
# swap-pane alone leaves the "active" flag on the original position, not on
# the pane that moved -- chaining select-pane with the same direction after
# the swap is what makes focus follow the pane as it hops across panes.
bind -r M-Left  swap-pane -t '{left-of}'  \; select-pane -t '{left-of}'
bind -r M-Right swap-pane -t '{right-of}' \; select-pane -t '{right-of}'
bind -r M-Up    swap-pane -t '{up-of}'    \; select-pane -t '{up-of}'
bind -r M-Down  swap-pane -t '{down-of}'  \; select-pane -t '{down-of}'

# -- window navigation -------------------------------------------------------
unbind n
unbind p
bind -r C-h previous-window
bind -r C-l next-window
bind -r C-S-H swap-window -t -1 \; select-window -t -1
bind -r C-S-L swap-window -t +1 \; select-window -t +1
bind -r S-Left  swap-window -t -1 \; previous-window
bind -r S-Right swap-window -t +1 \; next-window
bind Tab last-window   # move to last active window
bind n next-layout

# tmux-sensible used to inject these three whenever the key was still
# unbound (it does this for any prefix of the form C-<letter>, purely as a
# convenience, unrelated to the `set` options that made removing the
# plugin itself safe -- see MIGRATION.md). Reproduced natively since
# nothing else was using these keys.
bind a last-window       # prefix a == prefix Tab, since prefix is C-a
bind C-p previous-window
bind C-n next-window

# tmux-split-statusbar (removed, see MIGRATION.md) bound these two to
# toggle its fake 2-line bar and to hide the status line entirely.
# tmux-powerkit drives a real 2-line bar natively, so there's no "line
# count" to toggle the same way; these reconstruct the closest native
# equivalents: full status bar on/off, and 1-line/2-line.
bind -n C-F12 if -F '#{==:#{status},2}' 'set -g status on' 'set -g status 2'
bind -n S-F12 set -g status "#{?#{==:#{status},off},on,off}"

# -- vim/fzf aware pane switching --------------------------------------------
# Ctrl-hjkl move between tmux panes UNLESS the focused pane is running
# vim/nvim (or fzf, for C-j/C-k), in which case the keystroke passes
# through so the application's own bindings still work.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
is_fzf="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?fzf$'"

bind -n C-h run "($is_vim && tmux send-keys C-h) || tmux select-pane -L"
bind -n C-j run "($is_vim && tmux send-keys C-j) || \
                    ($is_fzf && tmux send-keys C-j) || tmux select-pane -D"
bind -n C-k run "($is_vim && tmux send-keys C-k) || \
                    ($is_fzf && tmux send-keys C-k)  || tmux select-pane -U"
bind -n C-l run "($is_vim && tmux send-keys C-l) || tmux select-pane -R"
bind -n 'C-\' if-shell "$is_vim" "send-keys 'C-\\'" "select-pane -l"

# clear screen + scrollback -- moved off C-l, which the vim-aware nav above
# now owns
bind -n M-l run "($is_vim && tmux send-keys M-l) || \
                    (tmux send-keys C-l; sleep 0.1; tmux clear-history)"

# -- copy mode ---------------------------------------------------------------
bind Enter copy-mode
bind Escape copy-mode

bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi C-v    send -X begin-selection \; send -X rectangle-toggle
bind -T copy-mode-vi y      send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H      send -X start-of-line
bind -T copy-mode-vi L      send -X end-of-line

# -- buffers -------------------------------------------------------------
bind P choose-buffer -Z

# -- mouse toggle -------------------------------------------------------
bind M {
  set-option -gF mouse "#{?mouse,off,on}"
  display-message "#{?mouse,Mouse: ON,Mouse: OFF}"
}

# -- marked-pane actions ------------------------------------------------
# a small custom key table for acting on tmux's "marked" pane
bind m {
  switch-client -T marked-pane-actions
  display-message "Marked pane actions mode"
}
bind -T marked-pane-actions m select-pane -m   # mark the active pane
bind -T marked-pane-actions M select-pane -M   # unmark the marked pane
bind -T marked-pane-actions g switch-client -t '{marked}'  # go to marked pane
bind -T marked-pane-actions s swap-pane   # swap active <-> marked
bind -T marked-pane-actions w swap-window # swap the windows containing them
bind -T marked-pane-actions j join-pane   # move marked pane next to active
bind -T marked-pane-actions d select-pane -d \; display-message "Pane disabled"
bind -T marked-pane-actions e select-pane -e \; display-message "Pane enabled"
bind -r -T marked-pane-actions Left  swap-pane -t '{left-of}'  \; select-pane -t '{left-of}'
bind -r -T marked-pane-actions Right swap-pane -t '{right-of}' \; select-pane -t '{right-of}'
bind -r -T marked-pane-actions Up    swap-pane -t '{up-of}'    \; select-pane -t '{up-of}'
bind -r -T marked-pane-actions Down  swap-pane -t '{down-of}'  \; select-pane -t '{down-of}'

# -- misc ------------------------------------------------------------------
bind C-x setw synchronize-panes
bind M-s choose-session -Z
bind M-w choose-window -Z
bind W command-prompt -p "Create pane from:" "join-pane -s ':%%'"

# toggle logging the active pane to a file on demand
bind C-q {
  pipe-pane -o "mkdir -p ~/.tmux/logs && cat >>~/.tmux/logs/#W-#P.log"
  display-message " Toggled logging to ~/.tmux/logs/#W-#P.log"
}

bind -r i run-shell "tmux neww tmux-cht.sh"

# -- fzf-git.sh compatibility ------------------------------------------------
# fzf-git.sh (https://github.com/junegunn/fzf-git.sh) binds its widgets on
# Ctrl-g; forward everything through a dedicated key table so tmux's own
# handling of C-g doesn't swallow it.
bind -n -T root C-g switch-client -T ctrl_g_mode
bind -T ctrl_g_mode C-B send-keys C-g C-B
bind -T ctrl_g_mode C-E send-keys C-g C-E
bind -T ctrl_g_mode C-F send-keys C-g C-F
bind -T ctrl_g_mode C-H send-keys C-g C-H
bind -T ctrl_g_mode C-L send-keys C-g C-L
bind -T ctrl_g_mode C-R send-keys C-g C-R
bind -T ctrl_g_mode C-S send-keys C-g C-S
bind -T ctrl_g_mode C-T send-keys C-g C-T
bind -T ctrl_g_mode C-W send-keys C-g C-W
bind -T ctrl_g_mode C-G send-keys C-g C-G  # used by fzf-marks
bind -T ctrl_g_mode b send-keys C-g b
bind -T ctrl_g_mode e send-keys C-g e
bind -T ctrl_g_mode f send-keys C-g f
bind -T ctrl_g_mode h send-keys C-g h
bind -T ctrl_g_mode l send-keys C-g l
bind -T ctrl_g_mode r send-keys C-g r
bind -T ctrl_g_mode s send-keys C-g s
bind -T ctrl_g_mode t send-keys C-g t
bind -T ctrl_g_mode w send-keys C-g w
bind -T ctrl_g_mode g send-keys C-g g  # used by fzf-marks
