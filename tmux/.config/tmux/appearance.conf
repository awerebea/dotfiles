# ~/.config/tmux/appearance.conf
#
# Status bar + pane border theming.
#
# tmux-powerkit (https://github.com/fabioluciano/tmux-powerkit) replaces Oh
# My Tmux's status bar entirely. Its plugin declaration lives in
# plugins.conf; everything here is `@powerkit_*` options, which just need to
# be set before plugins.conf's closing `run '.../tpm/tpm'` line -- tmux.conf
# guarantees that by sourcing this file first.
#
# NOTE: tmux-powerkit wasn't installed yet while this file was written (no
# way to render and eyeball it), so the handful of `external(...)` segments
# below (pane-focus badge, mouse, pairing, suspended-mode, whoami) are the
# least-tested part of this migration. Two of them (pairing, suspended-mode)
# embed a native tmux `#{?cond,a,b}` conditional, which contains commas --
# if tmux-powerkit's own comma-separated plugin-list parser splits on every
# comma rather than respecting the `external(...)` parens, those two lines
# will need to become simpler non-conditional content (e.g. just
# "#{session_many_attached}" with no conditional wrapper). Comment out the
# offending `-ag` line and simplify if that happens -- happy to iterate once
# it's actually on screen.

# -- theme -------------------------------------------------------------------
set -g @powerkit_theme "catppuccin"
set -g @powerkit_theme_variant "mocha"

# Oh My Tmux's look was flat color blocks divided by plain "|" separators,
# no powerline arrows. tmux-powerkit's whole point is the powerline look, so
# this switches to it deliberately -- set to "none" instead if you'd rather
# keep the old flat/pipe aesthetic.
set -g @powerkit_separator_style "rounded"

set -g @powerkit_status_position "top"

# two-line status bar, same request as before (used to be faked by the
# tmux-split-statusbar plugin -- tmux-powerkit drives tmux's real
# `status 2` / `status-format[]` natively, so that plugin is gone, see
# MIGRATION.md)
set -g @powerkit_bar_layout "double"
set -g @powerkit_status_order "session,windows,plugins"

# session segment recolors itself on prefix-press / copy-mode / pane-sync,
# which is the closest native equivalent to Oh My Tmux's separate
# #{prefix} keyboard icon and MunifTanjim/tmux-mode-indicator WAIT/COPY/SYNC
# labels (both removed, see MIGRATION.md)
set -g @powerkit_session_icon "auto"

# -- plugins (status-line segments) ------------------------------------------
# base list: modules with no custom content string
set -g @powerkit_plugins "kubernetes,battery,loadavg,cpu,memory,datetime,uptime,connectivity,hostname"

# pane-focus size/direction badge (graemedavidson/tmux-pane-focus) --
# reuses that plugin's own @pane-focus-* session options directly as tmux
# format text, no shell command needed
set -g -a @powerkit_plugins ',external(""|"[#{@pane-focus-direction}][#{@pane-focus-size}]"|"info-base"|"info-base-lighter"|"5")'

# mouse-mode indicator (was Oh My Tmux's #{mouse} icon)
set -g -a @powerkit_plugins ',external(""|"#(tmux show -gv mouse)"|"info-base"|"info-base-lighter"|"2")'

# multiple-clients-attached indicator (was Oh My Tmux's #{pairing} glasses).
# Native tmux conditional, not a shell command -- a #{...} format variable
# used inside a #(...) shell command gets substituted BEFORE the shell
# command runs, not passed through live, so this has to stay a plain
# conditional rather than something like `#(tmux display -p '#{...}')`.
set -g -a @powerkit_plugins ',external(""|"#{?session_many_attached,paired,}"|"warn-base"|"warn-base-lighter"|"5")'

# tmux-suspend "SUSPENDED" banner (was a raw shell snippet in the old
# status-right); #{client_key_table} is a native tmux format variable, so
# this is a plain conditional too, same reasoning as above
set -g -a @powerkit_plugins ',external(""|"#{?#{==:#{client_key_table},suspended},SUSPENDED,}"|"error-base"|"error-base-lighter"|"2")'

# current OS user (was Oh My Tmux's #{username}, which used a fancy
# SSH-hop-aware shell function; no such built-in exists once Oh My Tmux is
# gone, so this is the one segment that's a deliberate simplification, see
# MIGRATION.md)
set -g -a @powerkit_plugins ',external(""|"#(whoami)"|"info-base"|"info-base-lighter"|"300")'

# kubernetes context/namespace -- this is a real fix, not just a port: the
# old jonmosco/kube-tmux plugin's #{kube_tmux} variable was never actually
# wired up and rendered as dead blank space, see MIGRATION.md
set -g @powerkit_plugin_kubernetes_show_namespace "true"

set -g @powerkit_plugin_battery_icon ""
set -g @powerkit_plugin_battery_icon_charging ""
set -g @powerkit_plugin_battery_warning_threshold "30"
set -g @powerkit_plugin_battery_critical_threshold "15"

set -g @powerkit_plugin_loadavg_warning_threshold "30"
set -g @powerkit_plugin_loadavg_critical_threshold "80"

set -g @powerkit_plugin_cpu_warning_threshold "30"
set -g @powerkit_plugin_cpu_critical_threshold "80"

set -g @powerkit_plugin_memory_warning_threshold "50"
set -g @powerkit_plugin_memory_critical_threshold "80"

# %a %F %R -> "%a %Y-%m-%d %H:%M"
set -g @powerkit_plugin_datetime_format "%a %Y-%m-%d %H:%M"

set -g @powerkit_plugin_hostname_show_domain "false"

# -- pane borders (native tmux options, not tmux-powerkit) -------------------
set -g pane-border-status top
set -g pane-border-format '[#[bold]#{?pane_active,#[fg=green],#[fg=#9e9e9e]}#P#[fg=default,nobold]]#{?pane_active,#[bold]#[fg=green],#[fg=default]}-#[fg=default,nobold][#{?pane_active,#[bold]#[fg=green],#[fg=#9e9e9e]}#{pane_current_command}#[fg=default,nobold]]'
