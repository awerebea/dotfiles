# ~/.config/tmux/plugins.conf
#
# TPM plugin declarations and per-plugin settings.
#   prefix + I       install plugins listed below
#   prefix + U       update them
#   prefix + alt + u remove any not listed below
#
# Six plugins that used to live here are gone -- see MIGRATION.md for why
# each one was removed (tmux-sensible, tmux-power-zoom, tmux-plugin-sysstat,
# tmux-mode-indicator, tmux-split-statusbar, jonmosco/kube-tmux).

# -- appearance --------------------------------------------------------------
# status bar / theme framework; its @powerkit_* options live in
# appearance.conf, which tmux.conf sources before this file
set -g @plugin 'fabioluciano/tmux-powerkit'

# -- sessions / persistence -------------------------------------------------
set -g @plugin 'tmux-plugins/tmux-resurrect'
# save and restore window geometry for most terminals in X11
set -g @resurrect-hook-post-save-all 'eval $(xdotool getwindowgeometry --shell $WINDOWID); echo 0,$X,$Y,$WIDTH,$HEIGHT > $HOME/.tmux/resurrect/geometry'
set -g @resurrect-hook-pre-restore-all 'wmctrl -i -r $WINDOWID -e $(cat $HOME/.local/share/tmux/resurrect/geometry)'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

set -g @plugin 'spywhere/tmux-named-snapshot'
set -g @named-snapshot-switch-client 'N:tns'
set -g @named-snapshot-save 'm:manual p:* d:dev'
set -g @named-snapshot-restore 'M:manual P:* D:dev'

set -g @plugin 'omerxx/tmux-sessionx'
bind-key O select-pane -t :.+
set -g @sessionx-bind "o"
set -g @sessionx-x-path ""
set -g @sessionx-custom-paths ""
set -g @sessionx-custom-paths-subdirectories "true"
set -g @sessionx-filter-current "true"
set -g @sessionx-window-mode "off"
set -g @sessionx-zoxide-mode "off"

set -g @plugin 'omerxx/tmux-floax'
set -g @floax-bind "p"
set -g @floax-bind-menu "C-P"
set -g @floax-width "80%"
set -g @floax-height "80%"
set -g @floax-border-color "magenta"
set -g @floax-text-color "blue"
set -g @floax-change-path "true"

set -g @plugin 'graemedavidson/tmux-pane-focus'
# Press <prefix> + T to override settings for the current window
set -g @pane-focus-size '50'
set -g @pane-focus-direction '-'

set -g @plugin 'MunifTanjim/tmux-suspend'
set -g @suspend_key 'F12'

# -- copy / search / navigation ---------------------------------------------
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @copycat_search ?

set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_selection_mouse 'clipboard'  # or 'primary' or 'secondary'
set -g @yank_selection 'clipboard'        # or 'primary' or 'secondary'
set -g @yank_with_mouse on

set -g @plugin 'laktak/extrakto'
set -g @extrakto_key "tab"
set -g @extrakto_filter_order "all word line url path hash"
set -g @extrakto_grab_area "recent"
set -g @extrakto_fzf_tool "$HOME/.fzf/bin/fzf"

set -g @plugin 'roosta/tmux-fuzzback'
set -g @fuzzback-bind /
set -g @fuzzback-popup 1
set -g @fuzzback-popup-size '90%'

set -g @plugin 'IngoMeyer441/tmux-easy-motion'
bind-key n next-layout
set -g @easy-motion-prefix "Space"
set -g @easy-motion-binding-bd-w "Space"

set -g @plugin 'roy2220/easyjump.tmux'
set-option -g @easyjump-key-binding "S"
set-option -g @easyjump-auto-begin-selection "off"
set-option -g @easyjump-smart-case "on"

set -g @plugin 'schasse/tmux-jump'
set -g @jump-key 's'
set -g @jump-bg-color '\e[0m\e[90m'
set -g @jump-fg-color '\e[1m\e[32m'

set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-key F
set -g @thumbs-unique enabled
set -g @thumbs-reverse enabled
if-shell '[ $(uname -s) = Linux ]' {
  set -g @thumbs-command 'echo -n {} | xclip -selection clipboard && \
    tmux set-buffer -- {} && tmux display-message "Copied {}"'
  set -g @thumbs-multi-command 'echo -n {} | xclip -selection clipboard && \
    tmux set-buffer -- "{}" && tmux display-message "Copied multiple items!"'
} {
  set -g @thumbs-command 'echo -n {} | \
    pbcopy && tmux set-buffer -- {} && tmux display-message "Copied {}"'
  set -g @thumbs-multi-command 'echo -n {} | pbcopy && tmux set-buffer -- "{}" && \
    tmux display-message "Copied multiple items!"'
}
# 1. Absolute/home/relative paths with prefixes (with or without extension)
set -g @thumbs-regexp-1 '(?:\.{1,2}|~)?/[\w.~@$-]+(?:/[\w.~@$-]+)*(?:\.[\w]+)?(?::\d+:\d+| line \d+)?'
# 2. Relative paths without prefix (with or without extension)
set -g @thumbs-regexp-2 '[\w.~@$-]+(?:/[\w.~@$-]+)+(?:\.[\w]+)?(?::\d+:\d+| line \d+)?'
# 3. Simple filenames with extension (with optional line numbers)
set -g @thumbs-regexp-3 '\b[\w.~@$-]*[a-zA-Z][\w.~@$-]*\.[\w]+(?::\d+:\d+| line \d+)?\b'
# 4. URLs with optional file path and extension
set -g @thumbs-regexp-4 'https?://[\w./~@$-]+\.[\w]+'
# 5. Git log date/time formats (single segment)
set -g @thumbs-regexp-5 '(?:\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})|(?:[A-Z][a-z]{2} [A-Z][a-z]{2} \d{1,2} \d{2}:\d{2}:\d{2} \d{4}(?: [+-]\d{4})?)'
# Launches helper script on an upcase hint press
set -g @thumbs-upcase-command 'tmux run-shell "cd #{pane_current_path} && \
  $TMUX_PLUGIN_MANAGER_PATH/tmux-open-nvim/scripts/ton \"\$(echo \"{}\" | sed -E \"s/ line ([0-9]+)/:\\1:/\")\""'

set -g @plugin 'sainnhe/tmux-fzf'
bind-key "M-f" command-prompt { find-window -Z "%%" }
TMUX_FZF_LAUNCH_KEY="f"  # prefix Alt-f

set -g @plugin 'wfxr/tmux-fzf-url'
set -g @fzf-url-bind 'u'
set -g @fzf-url-history-limit '2000'

set -g @plugin 'jaclu/tmux-menus'
set -g @menus_trigger '@'

set -g @plugin 'addisonlynch/tmux-sidebar-plus'
set -g @sidebar-plus-sidebar-key 'b'
set -g @sidebar-plus-layout-key 'g'
set -g @sidebar-plus-position 'left'

# -- editor / open helpers ---------------------------------------------------
set -g @plugin 'tmux-plugins/tmux-open'
set -g @open-S 'https://www.google.com/search?q='
set -g @open-editor-command "tmux run-shell cd #{pane_current_path} && \
  $TMUX_PLUGIN_MANAGER_PATH/tmux-open-nvim/scripts/ton \"\$(echo \"{}\" | sed -E \"s/ line ([0-9]+)/:\\1:/\")\""

set -g @plugin 'trevarj/tmux-open-nvim'
set -g @ton-open-strategy ":e"

set -g @plugin 'aserowy/tmux.nvim'
set -g @tmux-nvim-navigation false
set -g @tmux-nvim-resize false

# -- logging / translation / misc -------------------------------------------
set -g @plugin 'tmux-plugins/tmux-logging'
# Logging: prefix + shift + p
# "Screen Capture": prefix + alt + p
# Save complete history: prefix + alt + shift + p
set -g @logging-path "$HOME/.tmux/logs"
set -g @screen-capture-path "$HOME/.tmux/logs"
set -g @save-complete-history-path "$HOME/.tmux/logs"

set -g @plugin 'awerebea/tmux-translator'
set -g @tmux-translator "M-t"
set -g @tmux-translator-width "38%"
set -g @tmux-translator-height "38%"
set -g @tmux-translator-from "en"
set -g @tmux-translator-to "ru"
set -g @tmux-translator-engine "google"

set -g @plugin 'kristopolous/tmux-gentrify'

# -- tpm bootstrap -- must stay last -----------------------------------------
# Plugins install under ~/.config/tmux/plugins, next to this config, not
# ~/.tmux/plugins (that path is Oh My Tmux's install location; kept
# separate so this config is fully standalone and doesn't share state with
# it. It's also where things already ended up on this machine while
# testing this migration, so this pins that down explicitly instead of
# leaving it to whatever TPM guesses.)
set -g @plugin_manager_path "$HOME/.config/tmux/plugins"
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins"

if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone --depth 1 https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm'"

set -g @tpm-update "U"

run '~/.config/tmux/plugins/tpm/tpm'
