[tools]
terraform = "latest"
python = "latest"
awscli = "latest"
pipx = "latest"
node = "lts"
go = "latest"
kubectl = "latest"

[settings]
# Honor .terraform-version, .python-version, .nvmrc/.node-version and
# .go-version files
idiomatic_version_file_enable_tools = ["terraform", "python", "node", "go"]
